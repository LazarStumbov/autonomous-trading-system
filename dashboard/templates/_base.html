<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}Trading Bot{% endblock %} — Dashboard</title>
<link rel="stylesheet" href="/static/style.css">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js" defer></script>
<script src="/static/dashboard.js" defer></script>
</head>
<body>
<!-- Sticky top status bar -->
<div id="status-bar"
     hx-get="/api/health/poll.json"
     hx-trigger="load, every 15s"
     hx-swap="none"
     hx-on::after-request="window.updateStatusBar(event)">
  <span id="sb-cron" class="sb-item">
    <span class="live-dot" id="sb-dot"></span>
    <span id="sb-cron-label">cron —</span>
  </span>
  <span class="sb-sep">|</span>
  <span class="sb-item" id="sb-halt">trading —</span>
  <span class="sb-sep">|</span>
  <span class="sb-item" id="sb-balance">balance —</span>
  <span class="sb-sep">|</span>
  <span class="sb-item" id="sb-pnl">P&amp;L —</span>
  <span class="sb-sep">|</span>
  <span class="sb-item" id="sb-positions">positions —</span>
  <span class="sb-sep">|</span>
  <span class="sb-item" id="sb-api">API —</span>
  <span class="sb-spacer"></span>
  <button id="halt-btn" onclick="window.haltTrading()" class="halt-btn" title="Emergency halt">⏹ HALT</button>
</div>

<header>
  <h1><a href="/">⚙ Trading Bot</a></h1>
  <nav>
    <a href="/">Status</a>
    <a href="/positions">Positions</a>
    <a href="/risk">Risk</a>
    <a href="/performance">Performance</a>
    <a href="/signals">Signals</a>
    <a href="/trades">Trades</a>
    <a href="/strategies">Strategies</a>
    <a href="/news">News</a>
    <a href="/execution">Execution</a>
    <a href="/memory">Memory</a>
    <a href="/api-costs">API Costs</a>
    <a href="/m" class="mobile-link">📱</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>read-only · 127.0.0.1 · <span id="last-updated">—</span></footer>
</body>
</html>
