{% extends "_base.html" %}
{% block content %}
<h2>Trade #{{ trade.id }} · {{ trade.asset }} · {{ trade.direction|upper }}</h2>
<table class="kv">
{% for k, v in trade.items() %}
  {% if k != 'reasoning' %}
  <tr><th>{{ k }}</th><td>{{ v }}</td></tr>
  {% endif %}
{% endfor %}
</table>
<h3>Reasoning</h3>
<pre>{{ reasoning_pretty }}</pre>
{% endblock %}
